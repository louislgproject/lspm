name: Verify cloud authority and archive retired local data
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-data-transfer
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: node scripts/check-publication-safety.js
      - name: Test direct collection, atomic review and retirement against PostgreSQL
        run: node --test kakao-cloud.test.js kakao-cloud-db.test.js local-retirement.test.js legacy-redirect.test.js
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/postgres
      - name: Apply additive cloud collection schema
        run: node scripts/deploy-supabase.js --schema-only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Preserve the final local originals and audit rows privately without replacing cloud edits
        run: node local-retirement.js archive
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LSPM_DB_BACKUP_KEY: ${{ secrets.LSPM_DB_BACKUP_KEY }}
      - name: Verify existing cloud application reads
        run: node scripts/verify-supabase.js
