name: Publish reviewed company updates
on:
  schedule:
    # Mexico City uses UTC-06:00 all year. GitHub may delay scheduled jobs.
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reviewed-company-updates
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: github-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Apply and verify reviewed business inbox
        run: node scripts/record-business-update.js --sync-pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
